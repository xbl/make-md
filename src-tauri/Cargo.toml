[package]
name = "make-md"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
notify = "8"
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = "3"
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
default = []
